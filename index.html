<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>to my loml</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500;1,600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* layout: one full-screen midnight sky; seven scenes stacked on top of it, each a single centered column that fades into the next */
:root{
  color-scheme:dark;
  --night-0:#04051a; --night-1:#0a0d2e; --night-2:#171d55; --night-3:#2a1a5e;
  --pink:#ffbfdc; --pink-deep:#ff8fc0; --rose:#e86aa6; --lavender:#c9b8ff;
  --lily:#7cc0ff; --lily-deep:#3d7bff;
  --warm:#fff4ec; --muted:#b9bde6; --faint:#8a90c2;
  --glass:rgba(255,255,255,.055); --line:rgba(255,191,220,.24);
  --f-display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Caveat","Segoe Script","Bradley Hand",cursive;
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --soft:cubic-bezier(.45,.05,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night-0);color:var(--warm);font:16px/1.5 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px;border-radius:8px}
#app{position:relative;height:100%;overflow:hidden;--px:0;--py:0}

/* ---------- sky ---------- */
.sky{position:absolute;inset:0;z-index:0;overflow:hidden;background:
  radial-gradient(120% 70% at 50% 108%,rgba(120,60,170,.55),transparent 60%),
  radial-gradient(90% 60% at 12% -10%,rgba(40,70,190,.45),transparent 62%),
  radial-gradient(70% 50% at 100% 30%,rgba(255,150,200,.10),transparent 60%),
  linear-gradient(180deg,#05061c 0%,#090c2c 55%,#120a30 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.b1{width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;background:radial-gradient(circle,rgba(255,150,200,.38),transparent 68%);animation:drift1 26s ease-in-out infinite alternate}
.b2{width:42vmax;height:42vmax;right:-16vmax;bottom:-14vmax;background:radial-gradient(circle,rgba(90,140,255,.4),transparent 68%);animation:drift2 32s ease-in-out infinite alternate}
.b3{width:30vmax;height:30vmax;left:30%;top:35%;background:radial-gradient(circle,rgba(190,160,255,.26),transparent 68%);animation:drift3 38s ease-in-out infinite alternate}
.stars{position:absolute;inset:-20px;transition:transform .6s ease-out}
.l1{transform:translate3d(calc(var(--px)*-5px),calc(var(--py)*-4px),0)}
.l2{transform:translate3d(calc(var(--px)*-10px),calc(var(--py)*-8px),0)}
.l3{transform:translate3d(calc(var(--px)*-16px),calc(var(--py)*-12px),0)}
.star{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:#eaf0ff;opacity:var(--o);box-shadow:0 0 calc(var(--s)*3) rgba(190,210,255,.7);animation:twinkle var(--t) ease-in-out var(--dl) infinite}
.star.pk{background:#ffd9ec;box-shadow:0 0 calc(var(--s)*3) rgba(255,180,215,.7)}
#app[data-mood="calm"] .star{opacity:calc(var(--o)*1.5)}
.mood{position:absolute;inset:0;opacity:0;transition:opacity 2.4s ease;pointer-events:none}
.mood.quiet{background:radial-gradient(80% 70% at 50% 50%,rgba(3,4,16,.15),rgba(2,3,12,.8))}
.mood.quiet::before,.mood.quiet::after{content:"";position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(80px)}
.mood.quiet::before{left:-20vmax;top:8%;background:radial-gradient(circle,rgba(255,150,200,.22),transparent 65%);animation:drift2 22s ease-in-out infinite alternate}
.mood.quiet::after{right:-24vmax;bottom:-6%;background:radial-gradient(circle,rgba(90,150,255,.26),transparent 65%);animation:drift1 28s ease-in-out infinite alternate}
.mood.deep{background:linear-gradient(180deg,rgba(2,3,12,.55),rgba(2,3,12,.12) 55%,rgba(50,24,92,.32))}
#app[data-mood="quiet"] .mood.quiet{opacity:1}
#app[data-mood="final"] .mood.deep,#app[data-mood="calm"] .mood.deep{opacity:1}

/* ---------- floating hearts ---------- */
.hearts{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.hearts.top{z-index:3}
.hf{position:absolute;bottom:-50px;left:var(--x);width:var(--s);height:var(--s);color:var(--c);opacity:0;animation:floatUp var(--dur) linear var(--seed,0s) forwards;pointer-events:none}
.hf.tap{pointer-events:auto;cursor:pointer}
.hf svg{width:100%;height:100%;fill:currentColor;filter:drop-shadow(0 0 6px currentColor);animation:sway var(--sw) ease-in-out infinite alternate}
.hf.popped{animation:none;opacity:0;transition:opacity .3s}
.fx{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}
.pt{position:absolute;pointer-events:none;will-change:transform,opacity}
.pt.s{background:currentColor;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.pt.h svg{width:100%;height:100%;fill:currentColor;filter:drop-shadow(0 0 5px currentColor)}
.flash{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;background:radial-gradient(60% 50% at 50% 50%,rgba(255,150,200,.4),transparent 70%)}
.flash.go{animation:flash 2.4s ease-out}

/* ---------- stage + scenes ---------- */
.stage{position:absolute;inset:0;z-index:2}
.scene{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:60px 16px 96px;opacity:0;transform:translateY(14px) scale(.985);filter:blur(8px);pointer-events:none;scrollbar-width:thin;scrollbar-color:rgba(255,191,220,.25) transparent;transition:opacity .65s ease,transform .8s var(--ease-out),filter .65s ease}
.scene.live{display:flex}
.scene.show{opacity:1;transform:none;filter:none;pointer-events:auto}
.scene:focus{outline:none}
.inner{margin:auto;width:100%;max-width:640px}
.eyebrow{font-size:.8rem;letter-spacing:.26em;color:var(--lavender)}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:1.6rem}
.rise{animation:rise 1s var(--ease-out) var(--d,0s) backwards}

/* glass + animated border */
.glass{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.03));border-radius:26px;-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 24px 60px -24px rgba(0,0,12,.8),inset 0 1px 0 rgba(255,255,255,.08)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(120deg,rgba(255,191,220,.75),rgba(201,184,255,.25),rgba(124,192,255,.65),rgba(255,191,220,.75));background-size:300% 300%;animation:borderflow 9s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none;opacity:.85}

/* shimmer text */
.shimmer{background:linear-gradient(100deg,#ffd0e6 15%,#ffffff 42%,#cfe6ff 56%,#ffb6d6 82%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shimmer 6s linear infinite}

/* buttons */
.btn{position:relative;font-weight:600;letter-spacing:.02em;color:#2a1030;background:linear-gradient(135deg,#ffd0e6,#ffa9cf 55%,#d8b8ff);border:0;border-radius:999px;padding:.95rem 1.7rem;cursor:pointer;box-shadow:0 10px 30px -10px rgba(255,143,192,.8),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .35s var(--spring),box-shadow .3s,opacity .3s}
.btn:hover{transform:translateY(-2px) scale(1.05)}
.btn:active{transform:scale(.93)}
.btn.ghost{color:var(--warm);background:var(--glass);box-shadow:inset 0 0 0 1px var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn[disabled]{opacity:.3;pointer-events:none}
.btn.ring::before,.btn.ring::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1.5px solid var(--pink);animation:ring 3.2s ease-out infinite;pointer-events:none}
.btn.ring::after{animation-delay:1.6s}

/* ---------- blue spider lily ---------- */
.lily-wrap{position:relative;width:clamp(150px,26vh,250px);aspect-ratio:240/320;max-width:100%;margin-inline:auto;--bs:.4s;--bd:2.4s;transform:translate3d(calc(var(--px)*6px),calc(var(--py)*4px),0);transition:transform .5s ease-out}
.lily-btn{position:absolute;inset:0;background:none;border:0;padding:0;cursor:pointer;display:block;border-radius:30%}
.lily-btn.poked{animation:wiggle .9s var(--spring)}
.lily{width:100%;height:100%;display:block;overflow:visible;position:relative}
.halo{position:absolute;inset:-34% -34% -10%;border-radius:50%;background:radial-gradient(closest-side,rgba(110,175,255,.5),rgba(110,175,255,.14) 55%,transparent 74%);opacity:0;animation:haloIn 2.4s ease-out calc(var(--bs) + 2.4s) forwards,breathe 7s ease-in-out calc(var(--bs) + 5.2s) infinite alternate;pointer-events:none}
.plant{transform-box:view-box;transform-origin:120px 312px;animation:sway2 9s ease-in-out calc(var(--bs) + 4s) infinite alternate}
.stem{stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1.8s ease-out calc(var(--bs)*.3) forwards}
.leaf{transform-box:fill-box;opacity:0;animation:grow 1.8s var(--ease-out) calc(var(--bs) + .3s) both}
.leaf.l{transform-origin:100% 100%}
.leaf.r{transform-origin:0% 100%;animation-delay:calc(var(--bs) + .55s)}
.petal{transform-box:view-box;transform-origin:120px 120px;opacity:0;filter:drop-shadow(0 0 3px rgba(110,170,255,.55));animation:bloom var(--bd) var(--ease-out) calc(var(--bs) + var(--i)*.3s) forwards}
.fil{fill:none;stroke:#c4e2ff;stroke-width:1.1;stroke-linecap:round;stroke-dasharray:140;stroke-dashoffset:140;opacity:.9;animation:draw 1.6s ease-out calc(var(--bs) + 1.9s + var(--i)*.14s) forwards}
.anth{fill:#ffd3e8;opacity:0;transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 0 4px #ff9fcb);animation:pop .8s var(--spring) calc(var(--bs) + 3s + var(--i)*.14s) forwards}
.core-glow{opacity:0;transform-box:fill-box;transform-origin:center;animation:haloIn 2s ease-out calc(var(--bs) + 2.2s) forwards,corePulse 5s ease-in-out calc(var(--bs) + 4.5s) infinite alternate}
.core{filter:drop-shadow(0 0 6px #bfe3ff)}
.sp{position:absolute;left:var(--l);top:var(--t);width:var(--z,10px);height:var(--z,10px);background:#eaf4ff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;filter:drop-shadow(0 0 4px #bfe3ff);animation:spark 5.5s ease-in-out calc(var(--bs) + 3.4s + var(--k)*.85s) infinite;pointer-events:none}

/* ---------- 1. intro ---------- */
.intro{display:flex;flex-direction:column;align-items:center;gap:.9rem;text-align:center;max-width:560px}
.intro .lily-wrap{margin-bottom:.4rem}
.greet{font-size:.95rem;letter-spacing:.16em;color:var(--lavender)}
.hb{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:clamp(2.2rem,9vw,3.6rem);line-height:1;letter-spacing:.02em;animation:track 1.9s var(--ease-out) 3.5s backwards,shimmer 6s linear 5.4s infinite}
.name{font-family:var(--f-display);font-weight:600;font-size:clamp(2.7rem,12.5vw,5.6rem);line-height:1;color:var(--pink);text-shadow:0 0 28px rgba(255,150,205,.5);animation:glowPulse 5s ease-in-out 7s infinite alternate}
.name .word{display:inline-block;white-space:nowrap}
.name .ch{display:inline-block;animation:letterIn 1s var(--spring) calc(4.6s + var(--i)*.1s) backwards}
.welcome{max-width:34ch;color:var(--muted);font-size:1.02rem}
.gift{position:relative;width:78px;height:76px;margin-top:.4rem;background:none;border:0;padding:0;cursor:pointer;animation:rise 1s var(--ease-out) 7.1s backwards,giftBob 3.4s ease-in-out 8.2s infinite}
.gift::after{content:"";position:absolute;left:50%;bottom:0;width:70px;height:70px;margin-left:-35px;border-radius:50%;border:1.5px solid var(--pink);opacity:0;animation:ring 3.6s ease-out 8.6s infinite;pointer-events:none}
.gift-box{position:absolute;left:7px;right:7px;bottom:0;height:46px;border-radius:4px 4px 9px 9px;background:linear-gradient(145deg,#ff9fc8,#e05a9b);box-shadow:0 8px 24px -6px rgba(255,120,185,.7)}
.gift-box::after,.gift-lid::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:13px;margin-left:-6.5px;background:linear-gradient(180deg,#fff4ec,#ffd9ea)}
.gift-lid{position:absolute;left:0;right:0;bottom:44px;height:24px;border-radius:6px;background:linear-gradient(145deg,#ffbcd9,#ee78ae);transition:transform .5s var(--spring)}
.bow{position:absolute;top:-15px;width:25px;height:17px;border:4px solid #fff4ec;border-radius:50% 50% 50% 0}
.bow.l{left:calc(50% - 28px);transform:rotate(-18deg)}
.bow.r{left:calc(50% + 3px);transform:rotate(18deg) scaleX(-1)}
.gift.shake{animation:giftShake .8s ease-in-out,giftBob 3.4s ease-in-out .8s infinite}
.gift.shake .gift-lid{animation:lidPop .8s var(--spring)}
.cta{margin-top:.8rem;animation:rise 1s var(--ease-out) 7.8s backwards}
.tip{margin-top:.4rem;font-size:.82rem;color:var(--faint);animation:rise 1.4s ease 9.6s backwards}

/* ---------- 2. letter ---------- */
.letter{max-width:600px}
.paper{padding:clamp(1.5rem,5vw,2.6rem)}
.paper .eyebrow{margin-bottom:1.4rem}
.lp{display:none;position:relative;margin-bottom:1.2rem;padding-left:1.1rem;font-size:1.14rem;line-height:1.7;color:var(--warm)}
.lp::before{content:"";position:absolute;left:0;top:.35em;bottom:.35em;width:2px;border-radius:2px;background:linear-gradient(180deg,var(--pink),var(--lavender));box-shadow:0 0 10px rgba(255,160,205,.7)}
.lp.shown{display:block;animation:lineIn 1.1s var(--ease-out) backwards}
.lp.first{font-family:var(--f-display);font-style:italic;font-size:2.3rem;line-height:1.1;margin-bottom:1.5rem}
.lp:last-of-type{color:var(--pink)}
.paper .actions{margin-top:1.2rem}

/* ---------- 3. reasons ---------- */
.reasons{max-width:760px;text-align:center}
.typed{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:clamp(1.4rem,4.6vw,2.1rem);color:var(--lavender);min-height:2.6em;text-wrap:balance}
.typing::after{content:"";display:inline-block;width:2px;height:1em;margin-left:3px;background:var(--pink);vertical-align:-.12em;animation:caret 1s steps(1) infinite}
.reasons-body{visibility:hidden;margin-top:1rem}
.reasons-body.ready{visibility:visible}
.reason-stage{min-height:min(42vh,300px);display:grid;place-items:center;padding:1rem 0}
.reason-text{font-family:var(--f-display);font-weight:500;font-size:clamp(2rem,8.4vw,4rem);line-height:1.12;max-width:17ch;text-wrap:balance}
.reason-text .w{display:inline-block;margin:0 .1em}
.reason-text.bounce{color:var(--pink);text-shadow:0 0 30px rgba(255,150,205,.45)}
.reason-text.blur{color:#e6dcff;text-shadow:0 0 30px rgba(190,165,255,.5)}
.reason-text.float{color:#d3eaff;text-shadow:0 0 30px rgba(124,192,255,.5)}
.bounce .w{animation:wBounce .9s var(--spring) calc(var(--k)*.11s) backwards}
.blur .w{animation:wBlur 2.1s ease calc(var(--k)*.12s) backwards}
.float .w{animation:wSettle 1.9s var(--ease-out) calc(var(--k)*.1s) backwards}
.rnav{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:1rem}
.segs{display:flex;gap:8px}
.seg{width:42px;height:4px;border-radius:4px;background:rgba(255,255,255,.14);transition:background .5s,box-shadow .5s}
.seg.on{background:linear-gradient(90deg,var(--pink),var(--lavender));box-shadow:0 0 10px rgba(255,160,205,.6)}
.count-txt{font-size:.85rem;letter-spacing:.1em;color:var(--faint);font-variant-numeric:tabular-nums;min-width:3.5em;text-align:center}

/* ---------- 4. cute cards ---------- */
.cute{max-width:860px;text-align:center}
.cute h2,.notes h2{font-family:var(--f-display);font-weight:500;font-style:italic;font-size:clamp(1.9rem,6vw,3rem);line-height:1.1;color:var(--pink);text-wrap:balance}
.sub{color:var(--faint);font-size:.9rem;margin-top:.5rem}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:1.6rem}
@media(min-width:760px){.cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}
.cell{height:170px}
.flip{position:relative;width:100%;height:100%;padding:0;background:none;border:0;cursor:pointer;perspective:900px;-webkit-tap-highlight-color:transparent}
.flip-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.3,1.35,.5,1),filter .5s}
.flip.on .flip-in{transform:rotateY(180deg);filter:drop-shadow(0 0 18px var(--c))}
.flip:hover .flip-in{filter:drop-shadow(0 0 12px var(--c))}
.flip.bump{animation:bump .6s var(--spring)}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;border-radius:20px;text-align:center;font-family:var(--f-display);font-weight:500;line-height:1.15;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.face.front{font-size:1.28rem;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid var(--c);color:var(--warm);box-shadow:inset 0 0 30px -12px var(--c)}
.face.back{transform:rotateY(180deg);font-size:1.12rem;font-weight:600;color:#2a1030;background:linear-gradient(150deg,var(--c),var(--c2))}
.cell:nth-child(1){--c:#ffa9cf;--c2:#e2c4ff}
.cell:nth-child(2){--c:#c9b8ff;--c2:#ffbfdc}
.cell:nth-child(3){--c:#7cc0ff;--c2:#d4ecff}
.cell:nth-child(4){--c:#ff8fc0;--c2:#ffd0e6}
.cell:nth-child(5){--c:#a9b8ff;--c2:#7cc0ff}
.cell:nth-child(6){--c:#ffc2dd;--c2:#c9b8ff}
.env-area{display:flex;flex-direction:column;align-items:center;gap:.7rem;margin-top:2.2rem}
.env-hint{font-size:.82rem;color:var(--faint)}
.env{position:relative;width:132px;height:90px;margin-top:34px;background:none;border:0;padding:0;cursor:pointer;perspective:500px;animation:giftBob 4s ease-in-out infinite}
.env .eb{position:absolute;inset:0;border-radius:7px;background:linear-gradient(160deg,#b9a6ff,#8f7bd8)}
.env .paper-in{position:absolute;left:12px;right:12px;top:8px;height:72px;border-radius:3px;background:#fff4ec;transition:transform .7s var(--spring)}
.env .paper-in::before,.env .paper-in::after{content:"";position:absolute;left:10px;right:10px;height:3px;border-radius:2px;background:rgba(120,90,160,.25)}
.env .paper-in::before{top:12px}.env .paper-in::after{top:22px;right:34px}
.env.open .paper-in{transform:translateY(-38px)}
.env .ef{position:absolute;inset:0;border-radius:7px;clip-path:polygon(0 100%,0 38%,50% 64%,100% 38%,100% 100%);background:linear-gradient(160deg,#cdbfff,#9c88e6)}
.env .flap{position:absolute;left:0;right:0;top:0;height:64%;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(180deg,#a894f0,#bba9ff);transform-origin:50% 0;transition:transform .6s var(--soft)}
.env .flap::after{content:"";position:absolute;left:50%;top:48%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--pink-deep);box-shadow:0 0 12px var(--pink)}
.env.open .flap{transform:rotateX(180deg)}
.env-note{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .6s var(--ease-out),opacity .6s;max-width:34ch}
.env-note.show{grid-template-rows:1fr;opacity:1}
.env-note>div{overflow:hidden;min-height:0}
.env-note p{padding:.9rem 1.1rem;font-family:var(--f-hand);font-size:1.45rem;line-height:1.2;color:#4a1f3a;background:#fff4ec;border-radius:6px;transform:rotate(-1deg);box-shadow:0 14px 30px -12px rgba(0,0,10,.7)}

/* ---------- 5. notes ---------- */
.notes{max-width:880px;text-align:center}
.notes-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;margin-top:1.8rem;text-align:left;align-items:start}
@media(min-width:720px){.notes-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.note{position:relative;border-radius:14px;transition:transform .5s var(--spring),box-shadow .4s}
.note:hover{transform:translateY(-4px) rotate(0deg)!important}

/* ---------- particles ---------- */
function origin(e, el) {
  const a = app.getBoundingClientRect();
  if (e && e.clientX) return [e.clientX - a.left, e.clientY - a.top];
  const r = el.getBoundingClientRect();
  return [r.left + r.width / 2 - a.left, r.top + r.height / 2 - a.top];
}
function burst(x, y, n = 14, mix = .6) {
  const fx = $('#fx');
  const count = REDUCED ? Math.min(n, 3) : n;
  for (let i = 0; i < count; i++) {
    const el = document.createElement('i');
    const heart = Math.random() < mix;
    const size = heart ? rand(10, 20) : rand(8, 15);
    el.className = 'pt ' + (heart ? 'h' : 's');
    el.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;color:${heart ? pickc(PINKS) : '#fff4ec'}`;
    if (heart) el.innerHTML = HEART_SVG;
    fx.appendChild(el);
    const a = rand(0, 6.283), d = rand(50, 150);
    const dx = Math.cos(a) * d, dy = Math.sin(a) * d - rand(20, 70);
    const anim = el.animate([
      { transform: 'translate(-50%,-50%) scale(.2) rotate(0deg)', opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(1) rotate(${rand(-60, 60)}deg)`, opacity: 1, offset: .6 },
      { transform: `translate(calc(-50% + ${dx * 1.1}px),calc(-50% + ${dy + 30}px)) scale(.6) rotate(${rand(-90, 90)}deg)`, opacity: 0 }
    ], { duration: rand(1000, 1800), easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'forwards' });
    anim.onfinish = () => el.remove();
  }
}

}

}

/* ---------- typewriter ---------- */
function typewrite(el, text, speed, done) {
  if (el._tw) el._tw.active = false;
  const my = epoch;
  const h = { active: true };
  el._tw = h;
  const end = () => {
    if (!h.active) return;
    h.active = false;
    el.textContent = text;
    el.classList.remove('typing');
    if (done) done();
  };
  h.finish = end;
  el.textContent = '';
  if (REDUCED) { end(); return h; }
  el.classList.add('typing');
  let i = 0;
  const step = () => {
    if (!h.active || my !== epoch) return;
    i++;
    el.textContent = text.slice(0, i);
    if (i >= text.length) { end(); return; }
    const c = text[i - 1];
    setTimeout(step, speed + (c === '.' || c === ',' ? 170 : 0) + rand(-8, 14));
  };
  setTimeout(step, speed);
  return h;
}

const ENTER = {
  intro() {},
  letter() { later(revealLetter, 1300); },
  reasons() { reasonsEnter(); },
  cute() {},
  notes() {},
  quiet() { later(() => showQuiet(0), 1200); },
  final() { finalEnter(); }
};

function go(name) {
  if (state.busy || state.scene === name) return;
  state.busy = true;
  const prev = state.scene ? $('#scene-' + state.scene) : null;
  const next = $('#scene-' + name);
  if (prev) prev.classList.remove('show');
  const my = epoch;
  setTimeout(() => {
    if (my !== epoch) return;
    if (prev) prev.classList.remove('live');
    state.scene = name;
    app.dataset.mood = MOODS[name] || 'night';
    app.classList.toggle('hud-on', name !== 'intro');
    if (ORDER.includes(name)) state.visited.add(name);
    next.classList.add('live');
    next.scrollTop = 0;
    requestAnimationFrame(() => requestAnimationFrame(() => next.classList.add('show')));
    updateHud();
    if (ENTER[name]) ENTER[name]();
    try { next.focus({ preventScroll: true }); } catch (e) {}
    setTimeout(() => { if (my === epoch) state.busy = false; }, 900);
  }, prev ? 650 : 0);
}

/* ---------- hud + secrets ---------- */
function sectionsSeen() { return SECTIONS.filter(s => state.visited.has(s)).length; }
function updateHud() {
  $$('.hud .dots i').forEach((d, i) => d.classList.toggle('on', state.visited.has(ORDER[i])));
  $('#count').textContent = `secrets ${state.found.size}/${SECRET_TOTAL}`;
  const unlocked = sectionsSeen() >= CONFIG.secretButton.unlockAfter;
  const b = $('#secretBtn');
  b.classList.toggle('unlocked', unlocked);
  b.setAttribute('aria-label', unlocked ? 'secret button, unlocked' : 'secret button, locked');
  if (unlocked && !state.unlockAnnounced) {
    state.unlockAnnounced = true;
    later(() => whisper(CONFIG.secretButton.unlockedHint, 4800), 1800);
  }
}
function found(id) {
  if (state.found.has(id)) return;
  state.found.add(id);
  updateHud();
  const c = $('#count');
  c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse');
}

function revealLetter() {
  const ps = $$('#scene-letter .lp');
  const btn = $('#letterBtn');
  if (state.letter < ps.length) {
    ps[state.letter].classList.add('shown');
    state.letter++;
    const sc = $('#scene-letter');
    later(() => sc.scrollTo({ top: sc.scrollHeight, behavior: 'smooth' }), 150);
  }
  const done = state.letter >= ps.length;
  btn.disabled = false;
  btn.textContent = done ? CONFIG.letter.done : CONFIG.letter.more;
  btn.dataset.mode = done ? 'go' : 'more';
}

/* ---------- reasons ---------- */
function reasonsEnter() {
  typewrite($('#reasonsHead'), CONFIG.reasons.intro, 42, () => {
    later(() => { $('#reasonsBody').classList.add('ready'); showReason(0); }, 350);
  });
}
function showReason(i) {
  const list = CONFIG.reasons.list;
  state.reason = i;
  const kind = ['bounce', 'blur', 'float'][i % 3];
  const box = $('#reasonText');
  box.className = 'reason-text ' + kind;
  box.innerHTML = list[i].split(' ').map((w, k) =>
    `<span class="w" style="--k:${k};--dx:${Math.round(rand(-60, 60))}px;--dy:${Math.round(rand(-70, 50))}px;--r:${Math.round(rand(-14, 14))}deg">${esc(w)}</span>`).join(' ');
  $$('#scene-reasons .seg').forEach((s, k) => s.classList.toggle('on', k <= i));
  $('#reasonCount').textContent = `${i + 1} / ${list.length}`;
  $('#reasonPrev').disabled = i === 0;
  const last = i === list.length - 1;
  $('#reasonNext').textContent = last ? CONFIG.reasons.after : CONFIG.reasons.next;
  if (last) celebrate();
}
function celebrate() {
  const now = Date.now();
  if (now - state.lastCelebrate < 2500) return;
  state.lastCelebrate = now;
  const f = $('#flash');
  f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  const a = app.getBoundingClientRect();
  [0, 350, 800].forEach(ms => later(() => burst(a.width / 2, a.height / 2, 14, .75), ms + 500));
}

/* ---------- quiet ---------- */
function showQuiet(i) {
  const q = CONFIG.quiet.list;
  state.quiet = i;
  $$('#quietDots i').forEach((d, k) => d.classList.toggle('on', k <= i));
  $('#quietPrev').disabled = i === 0;
  $('#quietNext').disabled = false;
  $('#quietNext').textContent = i === q.length - 1 ? CONFIG.quiet.last : CONFIG.quiet.next;
  state.tw = typewrite($('#quietText'), q[i], 40);
}

/* ---------- final ---------- */
function finalEnter() {
  const sc = $('#scene-final');
  const t = [1400, 4400, 8000, 10800];
  $$('.fl', sc).forEach((el, i) => later(() => el.classList.add('on'), t[i]));
  later(() => { sc.classList.add('ready'); app.dataset.mood = 'calm'; }, 13200);
}

/* ---------- overlay ---------- */
let overlayTrigger = null;
function openOverlay(title, text, trigger) {
  overlayTrigger = trigger || null;
  $('#ovTitle').textContent = title;
  $('#ovText').textContent = text;
  $('#ovClose').textContent = CONFIG.secretButton.close;
  $('#overlay').hidden = false;
  $('#ovClose').focus();
}
function closeOverlay() {
  $('#overlay').hidden = true;
  if (overlayTrigger) { try { overlayTrigger.focus({ preventScroll: true }); } catch (e) {} }
}

/* ---------- actions (event delegation: works for mouse, touch and keyboard) ---------- */
const H = {
  open() { go('letter'); },
  gift(t, e) {
    t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake');
    const [x, y] = origin(e, t); burst(x, y, 8, .7);
    randomWhisper();
  },
  flower(t, e) {
    t.classList.remove('poked'); void t.offsetWidth; t.classList.add('poked');
    const msgs = CONFIG.secrets.flower;
    whisper(msgs[state.flower % msgs.length], 4600);
    state.flower++;
    found('flower');
    const [x, y] = origin(e, t); burst(x, y - 20, 10, .3);
  },
  star(t, e) {
    const msgs = CONFIG.secrets.star;
    whisper(msgs[state.star % msgs.length], 4200);
    state.star++;
    found('star');
    const [x, y] = origin(e, t); burst(x, y, 10, .1);
  },
  heartfloat(t, e) {
    const [x, y] = origin(e, t);
    t.classList.add('popped');
    setTimeout(() => t.remove(), 350);
    burst(x, y, 7, .8);
    randomWhisper();
  },
  letterNext() {
    const b = $('#letterBtn');
    if (b.dataset.mode === 'go') go('reasons'); else revealLetter();
  },
  reasonPrev() { if (state.reason > 0) showReason(state.reason - 1); },
  reasonNext() {
    if (state.reason < CONFIG.reasons.list.length - 1) showReason(state.reason + 1); else go('cute');
  },
  flip(t) {
    const on = t.classList.toggle('on');
    t.setAttribute('aria-pressed', on);
    t.classList.remove('bump'); void t.offsetWidth; t.classList.add('bump');
    setTimeout(() => t.classList.remove('bump'), 700);
  },
  env(t) {
    const open = t.classList.toggle('open');
    t.setAttribute('aria-expanded', open);
    if (open) $('#envText').textContent = CONFIG.secrets.envelope;
    $('#envNote').classList.toggle('show', open);
    if (open) found('envelope');
  },
  goNotes() { go('notes'); },
  note(t) {
    const note = t.closest('.note');
    const open = !note.classList.contains('open');
    note.classList.remove('open'); void note.offsetWidth;
    note.classList.toggle('open', open);
    t.setAttribute('aria-expanded', open);
  },
  heart(t, e) {
    const msgs = CONFIG.secrets.heart;
    const out = $('#heartMsg');
    out.textContent = msgs[state.heart % msgs.length];
    out.classList.remove('swap'); void out.offsetWidth; out.classList.add('swap');
    state.heart++;
    found('heart');
    t.classList.remove('thump'); void t.offsetWidth; t.classList.add('thump');
    const [x, y] = origin(e, t); burst(x, y, 6, 1);
  },
  goQuiet() { go('quiet'); },
  quietPrev() { if (state.quiet > 0) showQuiet(state.quiet - 1); },
  quietNext() {
    if (state.tw && state.tw.active) { state.tw.finish(); return; }
    if (state.quiet < CONFIG.quiet.list.length - 1) showQuiet(state.quiet + 1); else go('final');
  },
  orb(t, e) {
    const card = $('#finalSecret');
    $('#finalSecretText').textContent = CONFIG.final.secret;
    card.classList.add('show');
    found('final');
    const [x, y] = origin(e, t); burst(x, y, 16, .6);
    later(() => { const sc = $('#scene-final'); sc.scrollTo({ top: sc.scrollHeight, behavior: 'smooth' }); }, 400);
  },
  secretBtn(t) {
    const need = CONFIG.secretButton.unlockAfter, n = Math.min(sectionsSeen(), need);
    if (sectionsSeen() < need) {
      whisper(CONFIG.secretButton.locked.replace('{n}', n).replace('{need}', need), 3800);
      return;
    }
    found('secretBtn');
    openOverlay(CONFIG.secretButton.title, CONFIG.secretButton.message, t);
  },
  closeOverlay() { closeOverlay(); },
  replay() { replay(); }
};

document.addEventListener('click', e => {
  if (e.target.id === 'overlay') { closeOverlay(); return; }
  const t = e.target.closest('[data-act]');
  if (!t || !H[t.dataset.act]) return;
  H[t.dataset.act](t, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#overlay').hidden) closeOverlay();
});

/* ---------- replay: resets everything, back to the opening screen ---------- */
function replay() {
  if (state.busy) return;
  state.busy = true;
  closeOverlay();
  $('#whisper').classList.remove('show');
  const cur = state.scene ? $('#scene-' + state.scene) : null;
  if (cur) cur.classList.remove('show');
  const my = epoch;
  setTimeout(() => {
    if (my !== epoch) return;
    resetState();
    mount();
    app.classList.remove('hud-on');
    app.dataset.mood = 'intro';
    updateHud();
    go('intro');
  }, 750);
}

/* ---------- gentle parallax ---------- */
if (!REDUCED) {
  let raf = 0, px = 0, py = 0;
  window.addEventListener('pointermove', e => {
    px = (e.clientX / window.innerWidth - .5) * 2;
    py = (e.clientY / window.innerHeight - .5) * 2;
    if (!raf) raf = requestAnimationFrame(() => {
      app.style.setProperty('--px', px.toFixed(3));
      app.style.setProperty('--py', py.toFixed(3));
      raf = 0;
    });
  }, { passive: true });
}

/* ---------- boot ---------- */
buildStars();
mount();
updateHud();
if (!REDUCED) {
  for (let i = 0; i < 6; i++) spawnHeart(false, true);
  setInterval(() => spawnHeart(false, false), 2000);
  setInterval(() => spawnHeart(true, false), 9000);
}
go('intro');
})();
</script>

</body></html>
